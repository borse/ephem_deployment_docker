# ──────────────────────────────────────────────
# PostgreSQL client authentication for the ePHEM database container.
# Loaded with `postgres -c hba_file=/etc/ephem-db/pg_hba.conf`
# (docker-compose.yml), in place of the file inside the data volume.
#
#   * The unix socket and loopback are reachable only from inside this
#     container (docker compose exec db ...), which is how every maintenance
#     script talks to it. Trusted, as the official image does.
#   * The cluster superuser (postgres) is refused over the network, whatever
#     its password: Odoo, or an addon running inside Odoo, can never become
#     superuser (COPY ... FROM PROGRAM, reading every database).
#   * Everyone else needs a SCRAM-SHA-256 password.
#
# Only the Odoo containers share a network with this one.
# ──────────────────────────────────────────────
# TYPE  DATABASE  USER      ADDRESS        METHOD
local   all       all                      trust
host    all       all       127.0.0.1/32   trust
host    all       all       ::1/128        trust

host    all       postgres  all            reject
host    all       all       all            scram-sha-256
