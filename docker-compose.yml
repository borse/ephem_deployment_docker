services:

  # ── PostgreSQL Database ────────────────────────
  db:
    image: postgres:16-alpine
    container_name: ephem-db
    restart: unless-stopped
    # pg_hba.conf from db-config/ (a folder mount, so an updated file is seen
    # on the next restart): the cluster superuser can never log in over the
    # network, whatever its password is. Maintenance runs through the unix
    # socket inside the container (docker compose exec db psql -U postgres).
    command: ["postgres", "-c", "hba_file=/etc/ephem-db/pg_hba.conf"]
    environment:
      # Cluster superuser — maintenance only, the app never connects as it.
      # The app uses the unprivileged role below, created by db-init/ on the
      # volume's FIRST start. A compromised addon connecting as a superuser
      # could read/drop every database and run OS commands in this container
      # (COPY ... FROM PROGRAM); the split removes that.
      # Servers installed before this change: setup.sh migrates the role.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      # App role (LOGIN CREATEDB, no superuser) — see db-init/01-app-role.sh
      ODOO_DB_USER: ${POSTGRES_USER:-odoo}
      ODOO_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
      - ./db-config:/etc/ephem-db:ro
    # Only Odoo (and the dev instances) share this network: nginx and certbot,
    # the containers that face the internet, cannot reach the database.
    networks:
      - ephem-internal
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # Minimal set the official postgres image needs to chown its data dir
    # and step down from root to the postgres user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Odoo / ePHEM Application ───────────────────
  odoo:
    # Production servers should pin a release (EPHEM_IMAGE_TAG=1.0.2 in .env)
    # so a pull never jumps versions silently; unset it for dev/demo = latest.
    image: borrs/ephem:${EPHEM_IMAGE_TAG:-latest}
    container_name: ephem-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      PORT: 5432
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      # ePHEM AI converts old Office files through the office service below,
      # never with a LibreOffice of its own. Odoo talks to the converter only
      # through office-gate, which is the one thing it shares a network with.
      EPHEM_OFFICE_URL: http://office-gate:2003
    volumes:
      - odoo-data:/var/lib/odoo
      # addons/ is a parent folder: addons/ePHEM-core (the ePHEM clone) plus any
      # repository added later from manage.sh. odoo.conf lists each subfolder.
      - ./addons:/mnt/extra-addons:ro
      # Read only: Odoo has no reason to rewrite its own configuration.
      - ./odoo.conf:/etc/odoo/odoo.conf:ro
      # Opt in local basemap files (bash manage.sh: Local basemap). Empty on a
      # server that never downloaded one, and the maps then use OpenFreeMap.
      - ./basemaps:/mnt/basemaps:ro
    networks:
      - ephem-internal   # the database
      - edge             # nginx
      - office-link      # office-gate (no route out, nothing else on it)
    # Runs as the non-root 'odoo' user baked into the image; needs no
    # capabilities at all.
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging: *default-logging
    expose:
      - "8069"
      - "8072"

  # ── Office converter (LibreOffice) ─────────────
  # ePHEM AI's reader for old Office, OpenDocument and RTF files: one
  # LibreOffice per conversion behind a small HTTP service, in its own
  # container because a document parser is where a crafted file (an email
  # attachment, an upload) does its damage. Here it has no database
  # credentials, no filestore, no addons, and its only network (office-only,
  # internal) has no route out: it answers Odoo and reaches nothing else.
  # Same release tag as the app image; EPHEM_OFFICE_TAG only for a release
  # that has no office image of its own (before 1.0.5).
  #
  # Odoo does not share a network with it. A document parser that is taken
  # over must not find the application next door: on a shared network it
  # could talk to Odoo's port directly, past nginx and its throttles. So the
  # office sits on office-only with office-gate, and Odoo reaches the gate on
  # office-link. A conversion is one request that Odoo opens and the answer
  # comes back on that same connection; the office never opens one of its own
  # toward Odoo, and nothing in its network leads there.
  office:
    image: borrs/ephem-office:${EPHEM_OFFICE_TAG:-${EPHEM_IMAGE_TAG:-latest}}
    container_name: ephem-office
    restart: unless-stopped
    # Reaps a LibreOffice left behind when a conversion is killed.
    init: true
    read_only: true
    environment:
      # One conversion at a time: two at once would run as the same user in
      # the same /tmp, and a crafted file could read the other one's document
      # (another database's, on a multi-tenant server). The rest queue.
      OFFICE_CONCURRENCY: ${OFFICE_CONCURRENCY:-1}
    volumes:
      # The only writable path: profiles, inputs and outputs of conversions.
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 1073741824
    networks:
      - office-only
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 2g
    memswap_limit: 2g        # no swap: a document never reaches the disk
    logging: *default-logging
    expose:
      - "2003"

  # ── Office gate (the only way to the converter) ─
  # A small nginx between Odoo and the office: it passes POST /convert and
  # GET /health and nothing else, caps the size and the number of requests in
  # flight, and streams (no copy of a document is kept). It is also what keeps
  # the two networks apart: Odoo is on office-link, the office on office-only,
  # and this is the only container on both. Unprivileged, read only, no
  # capabilities. Config: office-gate/nginx.conf.
  office-gate:
    image: nginx:alpine
    container_name: ephem-office-gate
    restart: unless-stopped
    depends_on:
      office:
        condition: service_healthy
    user: "101:101"
    read_only: true
    command: ["nginx", "-c", "/etc/ephem-office-gate/nginx.conf", "-g", "daemon off;"]
    volumes:
      - ./office-gate:/etc/ephem-office-gate:ro
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 16777216
    networks:
      - office-link
      - office-only
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 32
    mem_limit: 128m
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2003/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    expose:
      - "2003"

  # ── NGINX Reverse Proxy ────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ephem-nginx
    restart: unless-stopped
    depends_on:
      - odoo
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
      # The same files, served at /ephem/basemap/ so map tiles never queue
      # behind Odoo requests (nginx/default.conf).
      - ./basemaps:/srv/basemaps:ro
    # The container that faces the internet shares a network with Odoo and
    # with nothing else: not with the database, not with the converter.
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # nginx master runs as root to bind 80/443 and spawn workers as the
    # nginx user; this is the standard minimal set for the official image.
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID, NET_BIND_SERVICE]
    logging: *default-logging
    # Reload nginx every 6h so certificates renewed by certbot are actually
    # served — without this, nginx keeps the old cert in memory until it
    # expires, even though certbot renewed it on disk.
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec nginx -g \"daemon off;\"'"

  # ── Certbot (SSL certificates) ─────────────────
  certbot:
    image: certbot/certbot
    container_name: ephem-certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Reaches Let's Encrypt and nothing of ours (the challenge goes through
    # the certbot-www volume, which nginx serves).
    networks:
      - acme
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'"

volumes:
  postgres-data:
  odoo-data:
  certbot-etc:
  certbot-www:

networks:
  # Odoo and the database (and, in the developer stack, every Odoo instance).
  ephem-internal:
    driver: bridge
  # nginx and Odoo: the only path from the internet to the application.
  edge:
    driver: bridge
  # certbot alone: outbound to Let's Encrypt.
  acme:
    driver: bridge
  # No gateway on the next two: containers on them reach each other and
  # nothing else. Odoo + office-gate, then office-gate + the converter.
  office-link:
    driver: bridge
    internal: true
  office-only:
    driver: bridge
    internal: true