services:

  # ── PostgreSQL Database ────────────────────────
  db:
    image: postgres:16-alpine
    container_name: ephem-db
    restart: unless-stopped
    environment:
      # Cluster superuser — maintenance only, the app never connects as it.
      # The app uses the unprivileged role below, created by db-init/ on the
      # volume's FIRST start. A compromised addon connecting as a superuser
      # could read/drop every database and run OS commands in this container
      # (COPY ... FROM PROGRAM); the split removes that.
      # Servers installed before this change: setup.sh migrates the role.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      # App role (LOGIN CREATEDB, no superuser) — see db-init/01-app-role.sh
      ODOO_DB_USER: ${POSTGRES_USER:-odoo}
      ODOO_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    networks:
      - ephem-internal
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # Minimal set the official postgres image needs to chown its data dir
    # and step down from root to the postgres user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Odoo / ePHEM Application ───────────────────
  odoo:
    # Production servers should pin a release (EPHEM_IMAGE_TAG=1.0.2 in .env)
    # so a pull never jumps versions silently; unset it for dev/demo = latest.
    image: borrs/ephem:${EPHEM_IMAGE_TAG:-latest}
    container_name: ephem-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      PORT: 5432
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - odoo-data:/var/lib/odoo
      - ./custom-addons:/mnt/extra-addons:ro
      - ./odoo.conf:/etc/odoo/odoo.conf
    networks:
      - ephem-internal
    # Runs as the non-root 'odoo' user baked into the image; needs no
    # capabilities at all.
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging: *default-logging
    expose:
      - "8069"
      - "8072"

  # ── NGINX Reverse Proxy ────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ephem-nginx
    restart: unless-stopped
    depends_on:
      - odoo
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    networks:
      - ephem-internal
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # nginx master runs as root to bind 80/443 and spawn workers as the
    # nginx user; this is the standard minimal set for the official image.
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID, NET_BIND_SERVICE]
    logging: *default-logging
    # Reload nginx every 6h so certificates renewed by certbot are actually
    # served — without this, nginx keeps the old cert in memory until it
    # expires, even though certbot renewed it on disk.
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec nginx -g \"daemon off;\"'"

  # ── Certbot (SSL certificates) ─────────────────
  certbot:
    image: certbot/certbot
    container_name: ephem-certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    networks:
      - ephem-internal
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'"

volumes:
  postgres-data:
  odoo-data:
  certbot-etc:
  certbot-www:

networks:
  ephem-internal:
    driver: bridge