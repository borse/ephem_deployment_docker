# Who works where in the ePHEM repositories. merge_review.py reads this file to
# tell a developer's expected changes from changes to the platform or to
# someone else's modules.
#
# Patterns are shell globs. A pattern without a slash matches the top level
# folder (the module name, or a file at the root of the repository). A pattern
# with a slash matches the whole path (docs/*, scripts/cmp/*).
#
# Order of the checks for each changed folder:
#   1. [core] protected            -> PLATFORM, red on any developer branch
#   2. the developer's owns        -> own area
#   3. the developer's also        -> the developer's other modules
#   4. another developer's owns or also -> that developer's area, red
#   5. a module new on the branch  -> new module, amber (check its name)
#   6. [core] quiet_paths          -> documentation, information only
#   7. [core] shared               -> shared module, amber
#   8. anything else               -> unassigned, amber: decide and add it here
#
# A profile is picked by --dev, else by own_repos, else by branch name, else by
# whoever has most commits on the branch.

[core]
# Platform modules and files. A developer branch should not change them: every
# database runs them, whatever the developer's modules are.
protected =
    eoc_base
    eoc_signals
    eoc_incident_management
    eoc_incident_task_flexible
    eoc_actors
    eoc_rrt
    eoc_ims
    eoc_region
    eoc_regional_level*
    eoc_linelist
    eoc_dashboard
    eoc_demo_mode
    eoc_training_mode
    eoc_role_builder
    eoc_ai
    eoc_meetings
    eoc_4w*
    eoc_mass_mailing_tailoring
    eoc_eios_connector*
    eoc_dhis2_connector
    eoc_sso_only
    eoc_district_auto_state
    eoc_theme_backend
    eoc_api_migration
    eoc_project_management
    eoc_phsm
    eoc_signals_academy
    eoc_incident_academy
    ephem_theme_backend
    ephem_theme_push
    ephem_analytics
    ephem_analytics_eoc
    ephem_api_base
    ephem_custom_views
    ephem_documents
    ephem_drive_ui
    ephem_debrand
    ephem_survey
    # country settings modules
    eoc_austria
    eoc_bangladesh
    eoc_brazil
    eoc_cabo_verde
    eoc_czech
    eoc_ethiopia
    eoc_georgia
    eoc_iraq
    eoc_italy
    eoc_liberia
    eoc_sudan
    eoc_togo
    eoc_yemen
    # third party modules kept in the repository
    auditlog
    base_user_role
    dms
    helpdesk_mgmt
    mail_debrand
    mass_mailing_partner
    portal_odoo_debranding
    project_timeline
    remove_odoo_enterprise
    report_xlsx
    web_timeline
    disable_odoo_online
    # files that reach deployments
    setup.sh
    requirements-custom.txt
    __init__.py
    .gitignore
    .github/*
    scripts/update-modules.sh
    scripts/ci/*
    scripts/deploy/*
    scripts/migrate/*
    scripts/migration/*

# Modules several teams build on: not a single developer's, read every change.
shared =
    eoc_daily_sitrep
    eoc_report_letterhead
    eoc_dhis2_aggregate
    eoc_comms_gateway
    eoc_herams
    eoc_lims
    eoc_maintenance
    eoc_inventory
    eoc_field_desk*
    ephem_bridge
    eoc_rcce*
    eoc_signals_dashboard
    eoc_signal_dashboard
    eoc_incident_dashboard
    eoc_workforce_dashboard
    eoc_workforce_registry

# Paths that never run: documentation and planning notes.
quiet_paths =
    docs/*
    *.md
    elephant_goldfish/*
    RRT management tool/*

# The ePHEM team's own commit names (merges of the target into a branch, fixes).
