# ──────────────────────────────────────────────
# ePHEM office gate: the only door to the office converter.
#
# Odoo (network office-link) -> this nginx -> office (network office-only).
# The converter never shares a network with Odoo, so a document that takes
# LibreOffice over finds nothing to talk to except this gate, which only
# ever connects outward to it.
#
# It passes exactly what the Odoo client sends and nothing else:
#   POST /convert?from=doc&to=docx   body = the file, answer = the converted file
#   GET  /health
# Everything is streamed: no copy of a document is written anywhere.
# Runs as nginx (uid 101) on a read only filesystem with /tmp in memory.
# ──────────────────────────────────────────────
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 64;
}

http {
    access_log /dev/stdout;
    server_tokens off;

    # All scratch space in the in-memory /tmp (the image default is /var/cache).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Docker's resolver, asked again every few seconds: the office container
    # can be recreated (new image, new address) without restarting the gate.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Conversions in flight, all clients together. A converter run is bounded
    # (OFFICE_CONCURRENCY at a time, the rest queue); this bounds how many
    # uploads may wait, so a flood cannot pile documents up in its memory.
    limit_conn_zone $server_name zone=office_conn:64k;

    server {
        listen 2003;
        server_name _;

        # The file limit of both ends is 25 MB; a little above it so they
        # answer with their own readable 413.
        client_max_body_size    26m;
        client_header_timeout   10s;
        client_body_timeout     30s;
        send_timeout            120s;
        keepalive_timeout       5s;
        limit_conn              office_conn 8;

        proxy_http_version      1.1;
        proxy_set_header        Connection close;
        proxy_set_header        Host office;
        proxy_connect_timeout   5s;
        proxy_send_timeout      60s;
        # A conversion waits up to 60 s for a slot and runs up to 60 s more.
        proxy_read_timeout      130s;
        proxy_request_buffering off;
        proxy_buffering         off;

        location = /convert {
            limit_except POST { deny all; }
            set $office office:2003;
            proxy_pass http://$office;
        }

        location = /health {
            limit_except GET HEAD { deny all; }
            set $office office:2003;
            proxy_pass http://$office;
        }

        location / {
            return 404;
        }
    }
}
